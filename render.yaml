services:
  - type: web
    name: secureai
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRES_HOURS
        value: "8"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: sqlite:////app/instance/secureai.db
      - key: PORT
        value: "10000"
      - key: DEBUG
        value: "0"
      # Gemini answers. Paste a free Google AI Studio key as GEMINI_API_KEY in
      # the Render dashboard; without one the chat falls back to offline
      # policy mode. gemini-2.5-flash is no longer offered to new keys.
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
