services:
  - type: web
    name: secureai
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRES_HOURS
        value: "8"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: sqlite:////app/instance/secureai.db
      - key: PORT
        value: "10000"
      - key: DEBUG
        value: "0"
      - key: AI_PROVIDER
        value: mock
    disk:
      name: secureai-data
      mountPath: /app/instance
      sizeGB: 1
