services:
  - type: web
    name: secureai
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRES_HOURS
        value: "8"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: sqlite:////app/instance/secureai.db
      - key: PORT
        value: "10000"
      - key: DEBUG
        value: "0"
      # mock = offline policy mode (no key needed). For written AI answers,
      # set AI_PROVIDER=gemini and paste a free Google AI Studio key below.
      - key: AI_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
