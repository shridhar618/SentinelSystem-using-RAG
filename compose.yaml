services:
  backend:
    build:
      context: ./backend
    # AI_PROVIDER, GEMINI_API_KEY etc. come from backend/.env (never baked into the image).
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: 5001
      DEBUG: 0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///secureai.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "5001:5001"
    volumes:
      - backend_instance:/app/instance
      - backend_data:/app/app/data
      - backend_qdrant:/app/qdrant_data

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    environment:
      VITE_PROXY_TARGET: http://backend:5001
    ports:
      - "3000:3000"

volumes:
  backend_instance:
  backend_data:
  backend_qdrant:
